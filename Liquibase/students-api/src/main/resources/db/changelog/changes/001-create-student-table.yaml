databaseChangeLog:
  - changeSet:
      id: 001-create-student-table
      author: students-team
      changes:
        - createTable:
            tableName: student
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: first_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: last_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: age
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: filiere
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
        - insert:
            tableName: student
            columns:
              - column:
                  name: first_name
                  value: Alice
              - column:
                  name: last_name
                  value: Martin
              - column:
                  name: email
                  value: alice.martin@etud.fr
              - column:
                  name: age
                  valueNumeric: 21
              - column:
                  name: filiere
                  value: Informatique
