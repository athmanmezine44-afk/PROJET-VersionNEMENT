services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans le fichier .env}
    volumes:
      - students-data:/var/lib/postgresql/data   # aucun port publié : base inaccessible depuis Internet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U students -d students"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://localhost:5432/postgres
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  students-data:
