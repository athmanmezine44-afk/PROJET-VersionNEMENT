spring.application.name=students-api
server.port=8080

# --- Base de données : PostgreSQL ---
# Valeurs par défaut = celles du docker-compose.yml. Surchargeables par variables d'environnement
# (DB_URL, DB_USER, DB_PASSWORD) sans modifier ce fichier.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/students}
spring.datasource.username=${DB_USER:students}
spring.datasource.password=${DB_PASSWORD:students}
# Crée / met à jour les tables automatiquement (à remplacer par Flyway en production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Application ---
# Origines autorisées (CORS), séparées par des virgules
app.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
# Insère 6 étudiants de démonstration si la table est vide
app.seed.enabled=true
