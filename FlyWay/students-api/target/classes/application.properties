# ==============================================================
# Application & Server Configuration
# ==============================================================
server.port=8081
spring.application.name=students-api

# H2 database (local development and tests)
spring.datasource.url=jdbc:h2:mem:studentsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 console (http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate: Flyway owns schema changes; Hibernate validates the schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway database versioning
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

